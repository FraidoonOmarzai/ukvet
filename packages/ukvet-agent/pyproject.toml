[project]
name = "ukvet-agent"
version = "0.0.1"
description = "LangGraph due-diligence agent for UK companies — part of ukvet."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Fraidoon Omarzai" }]
dependencies = ["ukvet-mcp"]

[tool.uv.sources]
ukvet-mcp = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ukvet_agent"]
