[project]
name = "ukvet-mcp"
version = "0.0.1"
description = "MCP server for UK Companies House data — part of ukvet."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Fraidoon Omarzai" }]
dependencies = []

[project.scripts]
ukvet-mcp = "ukvet_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ukvet_mcp"]
