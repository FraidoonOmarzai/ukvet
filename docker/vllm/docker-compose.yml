# Serve ONE open-weight model with vLLM behind an OpenAI-compatible API (Phase 5, ADR-008).
# Run this on the rented GPU machine (Linux, NVIDIA driver + container toolkit installed), NOT on
# your PC. UNTESTED HERE: I had no GPU. Read the vLLM docs for your model and version, and adjust.
#
#   cp docker/vllm/vllm.env.example docker/vllm/vllm.env     # then edit it
#   docker compose --env-file docker/vllm/vllm.env -f docker/vllm/docker-compose.yml up -d
#   docker compose -f docker/vllm/docker-compose.yml logs -f
#
# From your PC, reach it through an SSH tunnel instead of opening the port to the internet:
#   ssh -N -L 8000:127.0.0.1:8000 user@gpu-host      then   LLM_BASE_URL=http://127.0.0.1:8000/v1
services:
  vllm:
    image: vllm/vllm-openai:${VLLM_TAG:?set VLLM_TAG to a pinned version}
    ports:
      - "127.0.0.1:8000:8000" # localhost only; use the SSH tunnel
    ipc: host
    volumes:
      - hf-cache:/root/.cache/huggingface
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    command: >
      --model ${MODEL:?set MODEL}
      --api-key ${VLLM_API_KEY:?set VLLM_API_KEY}
      --max-model-len ${MAX_MODEL_LEN:-8192}
      --dtype ${DTYPE:-auto}
      ${VLLM_EXTRA_ARGS:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
volumes:
  hf-cache:
