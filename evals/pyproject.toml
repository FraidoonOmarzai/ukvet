[project]
name = "ukvet-evals"
version = "0.1.0"
description = "Evaluation harness for ukvet: dataset, independent oracle, scorers (M1-M5) and CI gate."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx>=0.28.1",
    "respx>=0.23.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "ukvet-agent",
    "ukvet-mcp",
]

[project.scripts]
ukvet-evals = "ukvet_evals.cli:main"

[tool.uv.sources]
ukvet-agent = { workspace = true }
ukvet-mcp = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ukvet_evals"]
