[project]
name = "ukvet"
version = "0.1.0"
description = "ukvet — AI Due-Diligence Agent for UK Companies"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ukvet-agent",
    "ukvet-mcp",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]
notebook = [
    "jupyter>=1.1.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "ui"]

[tool.uv.sources]
ukvet-mcp = { workspace = true }
ukvet-agent = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]  # allow assert in tests

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ukvet_mcp", "ukvet_agent", "ukvet_ui"]
mypy_path = ["ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["ui"]
addopts = "--cov=ukvet_mcp --cov=ukvet_agent --cov-report=term-missing"
asyncio_mode = "auto"

[tool.coverage.report]
fail_under = 80
