[project]
name = "ukvet"
version = "0.1.0"
description = "ukvet — AI Due-Diligence Agent for UK Companies"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ukvet-agent",
    "ukvet-mcp",
    "ukvet-evals",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]
notebook = [
    "jupyter>=1.1.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "ui", "evals"]

[tool.uv.sources]
ukvet-mcp = { workspace = true }
ukvet-agent = { workspace = true }
ukvet-evals = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101", "UP046", "UP047"] 

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S603", "E501"]  # fake keys, subprocess, long fixture lines
"scripts/**" = ["S310", "E501"]
# data-heavy modules: seed strings, demo tables and report templates read better unwrapped
"evals/src/ukvet_evals/authoring.py" = ["E501"]
"evals/src/ukvet_evals/draft.py" = ["E501"]
"evals/src/ukvet_evals/demo.py" = ["E501"]
"evals/src/ukvet_evals/report.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ukvet_mcp", "ukvet_agent", "ukvet_ui", "ukvet_evals"]
mypy_path = "ui:evals/src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["ui", "evals/src"]
markers = ["live: calls a real LLM/API; opt in with -m live (needs keys)"]
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=ukvet_mcp --cov=ukvet_agent --cov=ukvet_evals --cov-report=term-missing"
asyncio_mode = "auto"

[tool.coverage.report]
fail_under = 80
